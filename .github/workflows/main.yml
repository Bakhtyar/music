name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Missing Gradlew File
      run: gradle wrapper

    - name: Build Android APK (Fix KSP Headless Error)
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace -Djava.awt.headless=true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: music-app-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          build/outputs/apk/debug/app-debug.apk
