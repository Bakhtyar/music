name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Check Folder Structure
      run: ls -la

    - name: Build Android APK
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        elif [ -f "app/gradlew" ]; then
          cd app
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "Error: gradlew file not found in root or app folder!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: music-app-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          build/outputs/apk/debug/app-debug.apk
