name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Missing Gradlew File
      run: gradle wrapper

    - name: Build Android APK (Bypass KSP Graphic Error)
      env:
        GRADLE_OPTS: "-Djava.awt.headless=true -Dkotlin.compiler.execution.strategy=in-process"
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace -Djava.awt.headless=true
