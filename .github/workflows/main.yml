name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper

    - name: Accept Android SDK Licenses
      run: yes | sdkmanager --licenses || true

    - name: Cache debug keystore
      id: keystore-cache
      uses: actions/cache@v4
      with:
        path: debug.keystore
        key: debug.keystore-v1

    - name: Generate debug keystore
      if: steps.keystore-cache.outputs.cache-hit != 'true'
      run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: story-canvas-apk
        path: app/build/outputs/apk/debug/app-debug.apk
